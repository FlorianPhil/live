    <!-- Arabia -->
    <path d="M598,170 L628,168 L648,184 L640,210 L620,218 L606,198 L596,182 Z"/>
    <!-- Eurasia main mass -->
    <path d="M526,98 L566,86 L612,84 L668,88 L724,90 L784,94 L842,98 L888,108 L912,124 L890,136 L914,150 L884,158 L902,172 L868,178 L848,166 L826,176 L804,164 L782,176 L760,162 L734,176 L712,160 L688,172 L668,156 L646,150 L620,140 L596,146 L572,132 L548,128 L534,114 Z"/>
