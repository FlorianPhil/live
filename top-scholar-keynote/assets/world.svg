<?xml version="1.0" encoding="UTF-8"?>
<!-- Simplified equirectangular world land outline. viewBox 0 0 1000 500,
     standard Atlantic-centered (lon 0 at x=500, lon -180 at x=0).
     Hand-simplified continent silhouettes, recognizable at small scale, light
     grey fill, no detail coastline. The deck's map slide inlines this same path
     and re-centers it on the Pacific (165E) by drawing the group twice with a
     horizontal shift, so the Europe -> Asia -> California route reads left to
     right. Keep this file in sync with WORLD_PATH in deck.js. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" width="1000" height="500">
  <g class="world-land" fill="#EBEBF0" stroke="#DCDCE6" stroke-width="0.6">
    <!-- North America -->
    <path d="M120,66 L175,58 L225,52 L268,58 L262,76 L300,82 L330,104 L352,126 L334,138 L348,158 L326,164 L300,150 L286,166 L268,150 L248,160 L232,150 L214,168 L200,150 L182,166 L168,150 L150,160 L140,140 L120,130 L138,116 L116,108 L140,98 L112,100 L92,92 L106,76 Z"/>
    <!-- Greenland -->
    <path d="M372,44 L410,38 L438,50 L432,72 L444,92 L416,104 L398,86 L384,96 L374,76 L388,60 Z"/>
    <!-- Central America -->
    <path d="M286,196 L312,192 L330,208 L352,232 L368,258 L360,266 L342,244 L322,224 L302,210 L288,202 Z"/>
    <!-- South America -->
